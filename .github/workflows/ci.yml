name: CI

# When this workflow runs: every push to main, and every pull request.
# Push is limited to main so a branch with an open PR is checked once
# (by the pull_request event) instead of twice.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code, so give its token nothing more.
permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      # A runner starts as an empty machine. This puts the commit under test on it.
      - name: Check out the repo
        uses: actions/checkout@v7

      # Same Python version pyproject.toml targets, so CI matches local runs.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned versions of pytest, ruff, mypy and pip-audit.
      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      # A failing test exits non-zero, which fails this step, the job, and the run.
      - name: Run tests
        run: pytest

  # The gate: three static checks. None of them runs the service.
  # Each is its own job with no `needs:`, so all four jobs run in parallel
  # and a failure in one never stops the others from reporting.

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      # Linter: reads the source for known bug patterns (rules in pyproject.toml).
      - name: Lint
        run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      # Type checker: checks the refunds package against its own annotations.
      - name: Type check
        run: mypy

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      # Dependency audit: compares the pinned runtime dependencies against
      # published vulnerability reports.
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
